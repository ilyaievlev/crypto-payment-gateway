name: crypto-payment

x-app: &app
  profiles: [apps]
  init: true
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  cap_drop: [ALL]
  restart: unless-stopped
  environment:
    HTTP_ADDR: :8080
    LOG_LEVEL: ${LOG_LEVEL:-debug}
  healthcheck:
    test: [CMD, /server, -healthcheck]
    interval: 5s
    timeout: 3s
    retries: 10
    start_period: 5s

services:
  postgres:
    image: postgres:17.4-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-crypto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-payment_core}
    ports: ["127.0.0.1:${POSTGRES_PORT:-15432}:5432"]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [backend]
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 20

  kafka:
    image: apache/kafka:3.9.1
    ports: ["127.0.0.1:${KAFKA_PORT:-19092}:9092"]
    environment:
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:29093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:${KAFKA_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'false'
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes: [kafka-data:/var/lib/kafka/data]
    networks: [backend]
    healthcheck:
      test: [CMD, /opt/kafka/bin/kafka-topics.sh, --bootstrap-server, kafka:29092, --list]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.9.1
    profiles: [tools]
    depends_on:
      kafka: {condition: service_healthy}
    networks: [backend]
    entrypoint: [/bin/sh, -ec]
    command:
      - |
        for topic in chain.events.v1 payment.events.v1 deadletter.v1; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:29092 --create --if-not-exists --topic "$$topic" --partitions 3 --replication-factor 1
        done

  api-gateway:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: api-gateway}}
    ports: ["127.0.0.1:18080:8080"]
    networks: [backend]

  payment-core:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: payment-core}}
    ports: ["127.0.0.1:8081:8080", "127.0.0.1:9081:9081"]
    environment: {HTTP_ADDR: ':8080', GRPC_ADDR: ':9081', LOG_LEVEL: '${LOG_LEVEL:-debug}'}
    networks: [backend, vault]

  chain-worker:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: chain-worker}}
    ports: ["127.0.0.1:8082:8080"]
    networks: [backend]

  webhook-sender:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: webhook-sender}}
    ports: ["127.0.0.1:8083:8080"]
    networks: [backend]

  crypto-vault:
    <<: *app
    build: {context: .., dockerfile: deploy/Dockerfile, args: {SERVICE: crypto-vault}}
    environment: {HTTP_ADDR: ':8080', GRPC_ADDR: ':9084', LOG_LEVEL: '${LOG_LEVEL:-debug}'}
    networks: [vault]
    # No host ports, Kafka, database, or external network access for vault.

networks:
  backend:
  vault: {internal: true}
volumes:
  postgres-data:
  kafka-data:
